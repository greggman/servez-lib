name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛒
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js ⬢
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test 🧪
        run: |
          npm ci
          npm run test
